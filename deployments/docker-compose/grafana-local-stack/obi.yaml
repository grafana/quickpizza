# OBI (OpenTelemetry eBPF Instrumentation) routes config.
#
# Excludes noisy infrastructure endpoints from OBI's captured spans/metrics: GET /metrics
# (scraped every few seconds by Prometheus/Alloy) and GET /debug/pprof/* (scraped by
# Pyroscope in pull mode - see pkg/http/http.go's NewServer). These are already excluded from
# the app's own OTel SDK in "sdk" mode (see isInternalRoute in pkg/http/http.go), but that
# exclusion is app-side router structure and has no effect on OBI: OBI captures HTTP traffic
# via eBPF at the socket level, independent of which chi router group handled the request, so
# it needs its own, separate exclusion here. See docs/otel.md.
#
# ignore_mode: all excludes matching routes from both traces and metrics (as opposed to just
# "traces" or just "metrics").
routes:
  ignore_mode: all
  ignored_patterns:
    - /metrics
    # /debug/pprof/* alone does not match the bare "/debug/pprof/" path itself (glob "*"
    # requires at least one more character after the trailing slash) - verified live: without
    # this literal entry, GET /debug/pprof/ (pyroscope's index page fetch) still showed up as
    # a trace even with /debug/pprof/* configured. Pyroscope also scrapes sub-paths like
    # /debug/pprof/goroutine, /debug/pprof/allocs, etc., which /debug/pprof/* does cover.
    - /debug/pprof/
    - /debug/pprof/*

# Log enricher: injects trace_id/span_id into the app's own JSON logs (written to stdout via
# slog) in place, for the request-handling thread of an active traced span. OBI never exports
# logs itself - Alloy's existing log pipeline would pick up the now-enriched lines unchanged.
# See https://opentelemetry.io/docs/zero-code/obi/trace-log-correlation/ and docs/otel.md.
#
# Schema verified against the v0.13.0 binary's own struct tags (the upstream docs example has
# a stray `service:` wrapper around `open_ports` that this version's parser rejects).
#
# Verified live: works, but only intermittently. obi's own startup log still reports
# logenricher=false for this process, and the container also logs "OBI will use
# process-internal maps; external features depending on pinned maps ... will be disabled"
# (bpffs isn't mounted in this local Docker Desktop setup) - despite that, some log lines
# from quickpizza do come out with a correct trace_id/span_id injected (confirmed by decoding
# the span_id and matching it to the exact "processing" span for that request in Tempo). This
# matches the documented caveat: "the log enricher only sees trace context when the log write
# happens on the request-handling thread" - most of this app's log writes apparently don't
# satisfy that, some do. Treat it as a real but unreliable signal in this environment, not as
# fully broken.
#
# `enabled` below does NOT actually gate this in v0.13.0 - verified live: with `enabled: false`
# and `services` still present, enrichment still fired on some log lines. Only removing the
# entire `log_enricher:` block (services included) stopped it. So it's the presence of
# `services` that activates this feature here, not `enabled` - to turn it off, comment out
# this whole block, not just this one field.
ebpf:
  log_enricher:
    enabled: true
    services:
      - open_ports: "3333"
