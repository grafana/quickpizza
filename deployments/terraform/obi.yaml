# OBI (OpenTelemetry eBPF Instrumentation) routes config.
#
# Excludes noisy infrastructure endpoints from OBI's captured spans/metrics: GET /metrics
# (scraped every few seconds by Prometheus/Alloy), GET /debug/pprof/* (scraped by Pyroscope in
# pull mode - see pkg/http/http.go's NewServer), and the Kubernetes liveness/readiness/gRPC
# health probes (qp-public-api.tf, qp-grpc.tf hit these every few seconds by design). None of
# these are ever traced by the app's own OTel SDK in "sdk" mode - /metrics and /debug/pprof/*
# via isInternalRoute in pkg/http/http.go, /ready and /healthz because AddLivenessProbes
# registers them directly on the router outside any Install() group, /grpchealthz because it's
# served on a separate listener outside the chi router entirely (pkg/grpc/grpc.go) - but none
# of that app-side structure has any effect on OBI, which captures HTTP traffic via eBPF at
# the socket level regardless of how the app itself routes or instruments a request. See
# docs/otel.md.
#
# ignore_mode: all excludes matching routes from both traces and metrics (as opposed to just
# "traces" or just "metrics").
routes:
  ignore_mode: all
  ignored_patterns:
    - /metrics
    - /ready
    - /healthz
    - /grpchealthz
    # /debug/pprof/* alone does not match the bare "/debug/pprof/" path itself (glob "*"
    # requires at least one more character after the trailing slash) - verified live: without
    # this literal entry, GET /debug/pprof/ (pyroscope's index page fetch) still showed up as
    # a trace even with /debug/pprof/* configured. Pyroscope also scrapes sub-paths like
    # /debug/pprof/goroutine, /debug/pprof/allocs, etc., which /debug/pprof/* does cover.
    - /debug/pprof/
    - /debug/pprof/*

# Log enricher: injects trace_id/span_id into the app's own JSON logs (written to stdout via
# slog) in place, for the request-handling thread of an active traced span. OBI never exports
# logs itself - Alloy's existing log pipeline would pick up the now-enriched lines unchanged.
# See https://opentelemetry.io/docs/zero-code/obi/trace-log-correlation/ and docs/otel.md.
#
# Schema verified against the v1.0.0 binary: each `services` entry needs a `service:` key
# holding a LIST of selectors. The bare `- open_ports: "3333"` form (accepted by v0.13.0)
# still parses on v1.0.0 but silently selects nothing, so no logs are enriched
# (`logenricher=false` in OBI's "instrumenting process" log line, 0 of 360 request log lines
# enriched in a live run).
#
# Verified live on v1.0.0 with the compose stack on Docker Desktop (not re-verified on a
# Kubernetes cluster): 100% of request log lines were enriched
# across 100 requests per endpoint, including sub-millisecond ones (the duration-dependent
# enrichment race seen on v0.13.0 is gone). OBI still logs "OBI will use process-internal maps"
# because bpffs isn't mounted, which only disables pinned-map features such as profile
# correlation; the log enricher doesn't need them. The enricher turns on trace context
# population itself, so `ebpf.populate_trace_context` isn't needed.
#
# There is no `enabled` field: the enricher is active whenever `services` is non-empty. To turn
# it off, comment out this whole block.
ebpf:
  log_enricher:
    services:
      - service:
          - open_ports: "3333"

# Kubernetes-only: with host_pid = true (obi.tf's DaemonSet), OBI can see every process on
# the node, not just this namespace's. All three selectors below must match (AND, not OR),
# so this scopes instrumentation to this deployment's own quickpizza pods specifically.
# k8s_namespace must match variables.tf's quickpizza_kubernetes_namespace default, and
# app.k8s.io/name must match every qp-*.tf Deployment's own label - update all three if
# either ever changes, this file isn't templated from them.
discovery:
  instrument:
    - exe_path: "/bin/quickpizza"
      k8s_namespace: "quickpizza"
      k8s_pod_labels:
        "app.k8s.io/name": "quickpizza-app"
