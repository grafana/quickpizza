services:
  alloy:
    image: grafana/alloy:v1.16.2
    container_name: alloy
    labels:
      - "service.type=instrumentation"
    volumes:
      - "./deployments/docker-compose/grafana-local-stack/${ALLOY_FILE_NAME:-config.alloy}:/config.alloy:Z"
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
    command:
      - run
      - /config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=public-preview
    ports:
      - "12345:12345"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      QUICKPIZZA_HOST: quickpizza:3333
      METRICS_ENDPOINT: http://prometheus:9090/api/v1/write
      TRACES_ENDPOINT: http://tempo:4317
      LOGS_ENDPOINT: http://loki:3100/loki/api/v1/push
      PROFILES_ENDPOINT: http://pyroscope:4040
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      # Default uses the same DB connection as the Quickpizza service. Use empty string to disable.
      DB_O11Y_CONNECTION: "${DB_O11Y_CONNECTION-postgres://postgres:postgres@quickpizza-db:5432/quickpizza_db?sslmode=disable}"
      SERVICE_NAMESPACE: "${SERVICE_NAMESPACE:-quickpizza}"
      DB_SERVICE_NAME: "quickpizza-db"
    depends_on:
      - quickpizza
      - prometheus
      - tempo
      - loki
      - pyroscope
  quickpizza:
    # The QUICKPIZZA_IMAGE env. variable enables the use of a locally built image,
    # created with `make docker-build`.
    image: ${QUICKPIZZA_IMAGE:-ghcr.io/grafana/quickpizza-local:0.15.30}
    container_name: quickpizza
    labels:
      - "service.type=application"
      - "service.namespace=${SERVICE_NAMESPACE:-quickpizza}"
    ports:
      - "3333:3333"
      - "3334:3334" # gRPC
    environment:
      QUICKPIZZA_OTLP_ENDPOINT: http://alloy:4318
      QUICKPIZZA_TRUST_CLIENT_TRACEID: 1
      QUICKPIZZA_ENABLE_ALL_SERVICES: 1 # 1 for monolithic mode
      QUICKPIZZA_OTEL_SERVICE_INSTANCE_ID: "quickpizza"
      QUICKPIZZA_OTEL_SERVICE_NAME: "quickpizza"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${DEPLOYMENT_ENVIRONMENT:-development},service.version=quickpizza-local"
      # sdk (default): this app's own OTel Go SDK instruments itself, as it always has.
      # obi: HTTP + business-logic traces and HTTP metrics are left for the OBI sidecar
      # below to capture instead - see the `obi:` service's own comment for the full
      # command (this alone does nothing without also passing --profile obi).
      QUICKPIZZA_OTEL_INSTRUMENTATION_MODE: "${QUICKPIZZA_OTEL_INSTRUMENTATION_MODE:-sdk}"
      # Read by OBI (not by this app) from this container's own environment, to label the
      # spans/metrics OBI captures for this process with the right service.name.
      OTEL_SERVICE_NAME: "quickpizza"
      # QUICKPIZZA_DB unset set to postgres. If empty, set to sqlite.
      QUICKPIZZA_DB: "${QUICKPIZZA_DB-postgres://postgres:postgres@quickpizza-db:5432/quickpizza_db?sslmode=disable}"
      # Enable logging. Possible values: error, warn, debug. Default: info
      # QUICKPIZZA_LOG_LEVEL: debug
    depends_on:
      quickpizza-db:
        condition: service_healthy

  # OBI (OpenTelemetry eBPF Instrumentation) instruments the quickpizza process from
  # outside it, via eBPF, instead of relying on this app's own OTel SDK. See docs/otel.md.
  #
  # To run it, BOTH of the following are required together - Compose can't derive one from
  # the other, so setting only one silently does the wrong thing:
  #   1. `--profile obi` on the compose invocation itself (this service has profiles: ["obi"]
  #      below, so it never starts without it - `docker compose ... up` alone leaves it off).
  #   2. `QUICKPIZZA_OTEL_INSTRUMENTATION_MODE=obi` on the `quickpizza` service above, so the
  #      app stops running its own OTel SDK (otherwise both this container AND the app's SDK
  #      instrument the same requests, producing duplicate spans).
  #
  # Full command:
  #
  #   QUICKPIZZA_OTEL_INSTRUMENTATION_MODE=obi \
  #     docker compose -f compose.grafana-local-stack.monolithic.yaml --profile obi up
  #
  # This container's own `environment:` below (OTEL_EBPF_OPEN_PORT/OTEL_EXPORTER_OTLP_*) is
  # needed regardless of mode. Separately, because of `pid: "service:quickpizza"` below, OBI
  # also reads OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES directly out of the `quickpizza`
  # container's own environment (set above) to label what it captures - this app never reads
  # those two vars itself; they exist purely for OBI to pick up.
  obi:
    image: otel/ebpf-instrument:v0.13.0
    container_name: obi
    labels:
      - "service.type=instrumentation"
    # Shares quickpizza's PID namespace so OBI can find and attach to its process;
    # privileged is required for the eBPF probes OBI attaches.
    pid: "service:quickpizza"
    privileged: true
    volumes:
      # Excludes /metrics and /debug/pprof/* from OBI's captured spans/metrics - these are
      # already excluded from the app's own OTel SDK by router structure (see
      # pkg/http/http.go's isInternalRoute), but that has no effect on OBI, which captures
      # HTTP traffic via eBPF independently of the app's routing. See obi.yaml's own comment.
      - "./deployments/docker-compose/grafana-local-stack/obi.yaml:/obi-config.yaml:Z"
    command: ["-config", "/obi-config.yaml"]
    environment:
      OTEL_EBPF_OPEN_PORT: "3333"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      - quickpizza
      - alloy
    profiles: ["obi"]

  quickpizza-db:
    image: postgres:18.1
    container_name: quickpizza-db
    labels:
      - "service.type=database"
      - "service.namespace=${SERVICE_NAMESPACE:-quickpizza}"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickpizza_db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.4.3
    container_name: loki
    labels:
      - "service.type=instrumentation"
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    labels:
      - "service.type=instrumentation"
    volumes:
      - ./deployments/docker-compose/grafana-local-stack/prometheus.yaml:/etc/prometheus.yaml
    command:
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus.yaml
    ports:
      - "9090:9090"

  pyroscope:
    image: grafana/pyroscope:1.16.0
    container_name: pyroscope
    labels:
      - "service.type=instrumentation"
    ports:
      - "4040:4040"

  tempo:
    image: grafana/tempo:2.9.0
    container_name: tempo
    labels:
      - "service.type=instrumentation"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deployments/docker-compose/grafana-local-stack/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo API/UI
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.0.1}
    container_name: grafana
    labels:
      - "service.type=instrumentation"
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_FEATURE_TOGGLES_ENABLE=tempoAlerting
    volumes:
      - ./deployments/docker-compose/grafana-local-stack/grafana:/etc/grafana/provisioning/

volumes:
  postgres_data:
