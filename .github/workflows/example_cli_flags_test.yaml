# DEMO: This workflow demonstrates how to pass CLI flags to k6 via the
# grafana/run-k6-action GitHub Action. It is not part of the real CI pipeline.
# See ci.yaml for the authoritative test workflow.
name: CLI Flags Test Workflow
on: [push]

permissions:
  contents: read

jobs:
  basic_k6_test:
    name: k6 test run - CLI flags example
    runs-on: ubuntu-latest

    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:0.15.30@sha256:93d322a244a1313842e2b3ccb791f993034dbeab716e69b7e760a4ae0fdc5d22 # zizmor: ignore[unpinned-images]
        ports:
          - 3333:3333

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - name: Run k6 test
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        with:
          path: |
            ./k6/foundations/01.basic.js
          flags: --vus 10 --duration 5s
