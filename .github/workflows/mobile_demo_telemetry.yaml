name: Mobile Demo Telemetry

on:
  # Manual trigger for ad hoc testing (pick branch in Actions UI)
  workflow_dispatch:
    inputs:
      run_diagnostics:
        description: "Also run Debug-tab diagnostics that emit handled exceptions and intentional crashes"
        required: false
        default: false
        type: boolean
  # Scheduled run every two hours for continuous telemetry
  schedule:
    - cron: "0 */2 * * *"
  # Post-merge full telemetry on main (PR compile checks use mobile_demo_telemetry_build.yaml)
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile_demo_telemetry.yaml"
      - ".github/scripts/**"
      - "Mobiles/telemetry/**"
      - "deployments/docker-compose/grafana-cloud/**"
      - "compose.grafana-cloud.dev-override.yaml"
      - "Mobiles/e2e/**"
      - "Mobiles/flutter/**"
      - "Mobiles/react-native/**"
      - "Mobiles/android/**"
      - "Mobiles/ios/**"
      - "compose.grafana-cloud.microservices.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: "stable"
  TELEMETRY_PROFILE: dual-stack

jobs:
  resolve-diagnostics-cadence:
    name: Resolve diagnostics cadence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Compute cadence once so the Android and iOS legs agree
    # (avoids an hour-boundary race between the two runners).
    outputs:
      run_handled_exception: ${{ steps.cadence.outputs.run_handled_exception }}
      run_crash: ${{ steps.cadence.outputs.run_crash }}
    steps:
      - name: Resolve cadence
        id: cadence
        env:
          FORCE_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_diagnostics == true }}
        run: |
          set -euo pipefail

          run_handled_exception=false
          run_crash=false
          hour_bucket=n/a
          schedule_bucket=n/a

          if [ "$FORCE_DIAGNOSTICS" = "true" ]; then
            run_crash=true
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            hour_bucket=$(($(date -u +%s) / 3600))
            schedule_bucket=$((hour_bucket / 2))
            if [ $((schedule_bucket % 3)) -eq 0 ]; then
              run_handled_exception=true
            fi
            if [ $((schedule_bucket % 10)) -eq 0 ]; then
              run_crash=true
              # The crash diagnostics flow already emits one handled exception first.
              run_handled_exception=false
            fi
          fi

          echo "run_handled_exception=${run_handled_exception}" >> "$GITHUB_OUTPUT"
          echo "run_crash=${run_crash}" >> "$GITHUB_OUTPUT"
          echo "Diagnostics event: ${GITHUB_EVENT_NAME}"
          echo "Diagnostics hour bucket: ${hour_bucket}"
          echo "Diagnostics schedule bucket: ${schedule_bucket}"
          echo "Handled-exception diagnostics: ${run_handled_exception}"
          echo "Crash diagnostics: ${run_crash}"

  run-mobile-demo:
    name: Run Android Mobile Demo
    needs: resolve-diagnostics-cadence
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: mobile-demo-telemetry
    permissions:
      id-token: write
      contents: read
    env:
      RUN_HANDLED_EXCEPTION_DIAGNOSTICS: ${{ needs.resolve-diagnostics-cadence.outputs.run_handled_exception }}
      RUN_CRASH_DIAGNOSTICS: ${{ needs.resolve-diagnostics-cadence.outputs.run_crash }}

    steps:
      - name: Get Vault secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@5d7e361bc7e0a183cde8afe9899fb7b596d2659b # v1.2.0
        with:
          repo_secrets: |
            OPENAI_API_KEY=openai_api_key:value
            MOBILE_TELEMETRY_DESTINATIONS=mobile_telemetry_destinations:value

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start dual-stack forwarding
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libpcre2-dev
          bash Mobiles/telemetry/install-tools.sh
          python3 Mobiles/telemetry/ci.py android

      - name: Free disk space for Android builds and emulator
        run: |
          echo "Disk space before cleanup:"
          df -h

          echo "Removing unnecessary tools..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean

          echo "Disk space after cleanup:"
          df -h

      - name: Build QuickPizza backend image
        run: |
          docker build -t quickpizza-mobile-local:ci .

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install Flutter dependencies
        working-directory: Mobiles/flutter
        run: flutter pub get

      - name: Create Flutter config.json for CI
        working-directory: Mobiles/flutter
        env:
          FARO_COLLECTOR_URL: ${{ env.FARO_COLLECTOR_URL }}
        run: |
          cat > config.json << EOF
          {
            "FARO_COLLECTOR_URL": "${FARO_COLLECTOR_URL}",
            "BASE_URL": "",
            "PORT": "3333",
            "CI_DEMO_VERSIONING": "true"
          }
          EOF
          echo "Created Flutter config.json (FARO_COLLECTOR_URL redacted)"

      - name: Build Flutter APK (debug)
        working-directory: Mobiles/flutter
        run: |
          echo "Building Flutter APK..."
          flutter build apk --debug --dart-define-from-file=config.json
          ls -la build/app/outputs/flutter-apk/

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ">=24.5.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install React Native dependencies
        working-directory: Mobiles/react-native
        run: yarn install --immutable

      - name: Create React Native config.json for CI
        working-directory: Mobiles/react-native
        env:
          FARO_COLLECTOR_URL: ${{ env.FARO_COLLECTOR_URL_RN }}
        run: |
          cat > config.json << EOF
          {
            "FARO_COLLECTOR_URL": "${FARO_COLLECTOR_URL}",
            "BASE_URL": "",
            "PORT": "3333"
          }
          EOF
          echo "Created React Native config.json (FARO_COLLECTOR_URL redacted)"

      - name: Resolve React Native demo app version
        run: |
          DEMO_APP_BASE_VERSION="$(node .github/scripts/read-demo-app-base-version.mjs react-native)"
          DEMO_APP_VERSION="$(node .github/scripts/resolve-demo-app-version.mjs "${DEMO_APP_BASE_VERSION}")"
          echo "DEMO_APP_VERSION=${DEMO_APP_VERSION}" >> "$GITHUB_ENV"
          echo "React Native demo app version: ${DEMO_APP_VERSION} (base: ${DEMO_APP_BASE_VERSION})"

      - name: Bundle JS for offline debug APK
        working-directory: Mobiles/react-native
        run: |
          mkdir -p android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev true \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build React Native APK (debug)
        working-directory: Mobiles/react-native/android
        run: |
          echo "Building React Native APK..."
          ./gradlew assembleDebug
          ls -la app/build/outputs/apk/debug/

      - name: Create Android Native config.json for CI
        working-directory: Mobiles/android
        env:
          OTLP_ENDPOINT: ${{ env.FARO_OTLP_URL_ANDROID }}
        run: |
          # The Faro OTLP ingest URL carries the app key in its path, so the
          # instance ID and token stay empty and no auth header is sent.
          mkdir -p app/src/main/res/raw
          cat > app/src/main/res/raw/config.json << EOF
          {
            "OTLP_ENDPOINT": "${OTLP_ENDPOINT}",
            "OTLP_INSTANCE_ID": "",
            "OTLP_API_KEY": "",
            "BASE_URL": ""
          }
          EOF
          echo "Created Android Native config.json (OTLP endpoint redacted)"

      - name: Resolve Android Native demo app version
        run: |
          ANDROID_NATIVE_DEMO_BASE_VERSION="$(node .github/scripts/read-demo-app-base-version.mjs android-native)"
          ANDROID_NATIVE_DEMO_APP_VERSION="$(node .github/scripts/resolve-demo-app-version.mjs "${ANDROID_NATIVE_DEMO_BASE_VERSION}")"
          echo "ANDROID_NATIVE_DEMO_APP_VERSION=${ANDROID_NATIVE_DEMO_APP_VERSION}" >> "$GITHUB_ENV"
          echo "Android Native demo app version: ${ANDROID_NATIVE_DEMO_APP_VERSION} (base: ${ANDROID_NATIVE_DEMO_BASE_VERSION})"

      - name: Build Android Native APK (debug)
        working-directory: Mobiles/android
        run: |
          echo "Building native Android APK..."
          ./gradlew :app:assembleDebug -PquickpizzaDemoVersionName="${ANDROID_NATIVE_DEMO_APP_VERSION}"
          ls -la app/build/outputs/apk/debug/

      - name: Stage APKs for e2e
        run: |
          mkdir -p apk/flutter apk/react-native apk/android-native
          cp Mobiles/flutter/build/app/outputs/flutter-apk/app-debug.apk apk/flutter/
          cp Mobiles/react-native/android/app/build/outputs/apk/debug/app-debug.apk apk/react-native/
          cp Mobiles/android/app/build/outputs/apk/debug/app-debug.apk apk/android-native/

      - name: Verify APKs
        run: |
          echo "Verifying built APKs..."
          ls -la apk/flutter/
          file apk/flutter/app-debug.apk
          echo "Flutter APK size: $(du -h apk/flutter/app-debug.apk | cut -f1)"
          ls -la apk/react-native/
          file apk/react-native/app-debug.apk
          echo "React Native APK size: $(du -h apk/react-native/app-debug.apk | cut -f1)"
          ls -la apk/android-native/
          file apk/android-native/app-debug.apk
          echo "Android Native APK size: $(du -h apk/android-native/app-debug.apk | cut -f1)"
          echo "APKs verified"

      - name: Start QuickPizza backend (Docker Compose)
        env:
          DEPLOYMENT_ENVIRONMENT: ci
          # Use dev Alloy config for grafana-dev.net stack
          ALLOY_FILE_NAME: cloud-dev.alloy
          QUICKPIZZA_IMAGE: quickpizza-mobile-local:ci
          QUICKPIZZA_OTEL_RECORD_BODIES: "true"
        run: |
          echo "Starting QuickPizza backend (Grafana Cloud microservices + dev Alloy override)..."
          bash Mobiles/telemetry/backend-compose.sh up -d
          bash Mobiles/telemetry/backend-compose.sh ps

          python3 Mobiles/telemetry/telemetry.py status --run-dir Mobiles/telemetry/.runtime/ci
          echo "Waiting for backend to be ready..."
          for i in {1..60}; do
            if curl -fsS "http://localhost:3333/ready" > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend... attempt $i/60"
            sleep 2
          done

          echo "Backend did not become ready in time"
          bash Mobiles/telemetry/backend-compose.sh logs --no-color catalog config copy public-api recommendations ws grpc
          exit 1

      - name: Wait for backend Alloy
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:12345/-/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Backend Alloy not ready; destination configuration needs checking."
          exit 1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Install shared e2e report generator deps
        working-directory: Mobiles/e2e/report-generator
        run: npm ci --ignore-scripts

      - name: Run Android emulator and e2e tests
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        env:
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          disable-spellchecker: true
          disk-size: 4096M
          heap-size: 384M
          emulator-boot-timeout: 300
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none"
          script: |
            echo "Emulator is running!"
            adb devices -l
            adb shell getprop ro.build.fingerprint
            adb shell getprop ro.kernel.qemu
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true

            # The apps are built with an empty BASE_URL, so they reach the
            # host backend at http://10.0.2.2:3333; no adb reverse is needed.

            echo "==> Flutter APK: install and E2E"
            adb install -r apk/flutter/app-debug.apk
            bash Mobiles/e2e/run_e2e_tests.sh --app=flutter --platform=android
            sleep 30 # Allow normal SDK export before stopping the app.
            adb shell am force-stop com.example.flutter_mobile_o11y_demo || true

            echo "==> React Native APK: install and E2E"
            adb install -r apk/react-native/app-debug.apk
            bash Mobiles/e2e/run_e2e_tests.sh --app=react-native --platform=android
            sleep 30 # Allow normal SDK export before stopping the app.
            adb shell am force-stop com.grafana.quickpizza.rn || true

            echo "==> Android Native APK: install and E2E"
            adb install -r apk/android-native/app-debug.apk
            bash Mobiles/e2e/run_e2e_tests.sh --app=android-native --platform=android
            sleep 30 # Allow normal SDK export before stopping the app.
            adb shell am force-stop com.grafana.quickpizza.android || true

            # android-emulator-runner executes script lines individually, so
            # keep diagnostics gating as one-line commands instead of a
            # multi-line shell if block.
            [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" = "true" ] || echo "Skipping handled-exception diagnostics for this run."
            [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || echo "==> Flutter APK: handled-exception diagnostics E2E"
            [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=flutter --platform=android --flow=handled-exception
            [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || echo "==> React Native APK: handled-exception diagnostics E2E"
            [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=react-native --platform=android --flow=handled-exception
            [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || echo "==> Android Native APK: handled-exception diagnostics E2E"
            [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=android-native --platform=android --flow=handled-exception

            [ "$RUN_CRASH_DIAGNOSTICS" = "true" ] || echo "Skipping crash diagnostics for this run. Manual runs can force this with run_diagnostics=true."
            [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || echo "==> Flutter APK: crash diagnostics E2E"
            [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=flutter --platform=android --flow=diagnostics
            [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || echo "==> React Native APK: crash diagnostics E2E"
            [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=react-native --platform=android --flow=diagnostics
            [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || echo "==> Android Native APK: crash diagnostics E2E"
            [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=android-native --platform=android --flow=diagnostics

            echo "E2E tests completed (Flutter, React Native, Android Native on same emulator)."

      - name: Finish telemetry export
        run: |
          sleep 30
          python3 Mobiles/telemetry/telemetry.py status --run-dir Mobiles/telemetry/.runtime/ci

      - name: Upload e2e test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-android
          path: Mobiles/e2e/results/
          retention-days: 1
          if-no-files-found: ignore

      - name: Collect backend logs
        if: always()
        run: |
          bash Mobiles/telemetry/backend-compose.sh logs --no-color catalog config copy public-api recommendations ws grpc > backend.log 2>&1 || true

      - name: Stop backend
        if: always()
        run: |
          bash Mobiles/telemetry/backend-compose.sh drain || true
          bash Mobiles/telemetry/backend-compose.sh down -v || true

      - name: Stop dual-stack forwarding
        if: always()
        run: python3 Mobiles/telemetry/telemetry.py stop --run-dir Mobiles/telemetry/.runtime/ci

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-logs-android
          path: backend.log
          retention-days: 3
          if-no-files-found: ignore

  run-ios-mobile-demo:
    name: Run iOS Mobile Demo
    needs: resolve-diagnostics-cadence
    # macOS-only: xcrun simctl + the booted iOS simulator only work on macOS.
    runs-on: macos-26
    timeout-minutes: 75
    environment: mobile-demo-telemetry
    permissions:
      id-token: write
      contents: read
    env:
      RUN_HANDLED_EXCEPTION_DIAGNOSTICS: ${{ needs.resolve-diagnostics-cadence.outputs.run_handled_exception }}
      RUN_CRASH_DIAGNOSTICS: ${{ needs.resolve-diagnostics-cadence.outputs.run_crash }}

    steps:
      - name: Get Vault secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@5d7e361bc7e0a183cde8afe9899fb7b596d2659b # v1.2.0
        with:
          repo_secrets: |
            OPENAI_API_KEY=openai_api_key:value
            MOBILE_TELEMETRY_DESTINATIONS=mobile_telemetry_destinations:value

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Start dual-stack forwarding
        run: |
          brew install openssl@3 pcre2
          bash Mobiles/telemetry/install-tools.sh
          python3 Mobiles/telemetry/ci.py ios

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphonesimulator

      - name: Create Config.xcconfig for CI
        working-directory: Mobiles/ios
        env:
          OTLP_ENDPOINT: ${{ env.FARO_OTLP_URL_IOS }}
        run: |
          # BASE_URL points at localhost on the host running the simulator,
          # which is the same machine as the runner. xcconfig URLs require
          # /$()/ to escape the :// since semicolons split values.
          # The Faro OTLP ingest URL carries the app key in its path, so the
          # instance ID and token stay empty and no auth header is sent.
          cat > Config.xcconfig <<EOF
          BASE_URL = http:/\$()/localhost:3333
          PORT = 3333
          OTLP_ENDPOINT = ${OTLP_ENDPOINT}
          OTLP_INSTANCE_ID =
          OTLP_API_KEY =
          EOF
          echo "Created Config.xcconfig (OTLP endpoint redacted)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ">=24.5.0"

      - name: Resolve iOS Native demo app version
        run: |
          IOS_NATIVE_DEMO_BASE_VERSION="$(node .github/scripts/read-demo-app-base-version.mjs ios-native)"
          IOS_NATIVE_DEMO_APP_VERSION="$(node .github/scripts/resolve-demo-app-version.mjs "${IOS_NATIVE_DEMO_BASE_VERSION}")"
          echo "IOS_NATIVE_DEMO_APP_VERSION=${IOS_NATIVE_DEMO_APP_VERSION}" >> "$GITHUB_ENV"
          echo "iOS Native demo app version: ${IOS_NATIVE_DEMO_APP_VERSION} (base: ${IOS_NATIVE_DEMO_BASE_VERSION})"

      - name: Build iOS .app for Simulator
        id: build-ios-app
        working-directory: Mobiles/ios
        run: |
          set -e
          echo "Building QuickPizzaIos.app for iOS Simulator..."
          mkdir -p build/ci
          SRCROOT="$PWD" Scripts/generate-config.sh
          set +e
          xcodebuild \
            -project QuickPizzaIos.xcodeproj \
            -scheme QuickPizzaIos \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${IOS_NATIVE_DEMO_APP_VERSION}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build > build/ci/xcodebuild.log 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo "xcodebuild failed with status $build_status"
            echo "Relevant build diagnostics:"
            grep -nE "error:|fatal error:|BUILD FAILED|The following build commands failed|Command SwiftCompile failed" build/ci/xcodebuild.log | tail -200 || true
            echo "Last 300 xcodebuild log lines:"
            tail -300 build/ci/xcodebuild.log
            exit "$build_status"
          fi

          tail -80 build/ci/xcodebuild.log

          APP_PATH=$(find DerivedData/Build/Products -name "QuickPizzaIos.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not locate built QuickPizzaIos.app under DerivedData"
            exit 1
          fi
          echo "Built app: $APP_PATH"
          echo "app_path=$(pwd)/$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload iOS build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-build-log
          path: Mobiles/ios/build/ci/xcodebuild.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install Flutter dependencies
        working-directory: Mobiles/flutter
        run: flutter pub get

      - name: Create Flutter config.json for CI
        working-directory: Mobiles/flutter
        env:
          FARO_COLLECTOR_URL: ${{ env.FARO_COLLECTOR_URL }}
        run: |
          cat > config.json << EOF
          {
            "FARO_COLLECTOR_URL": "${FARO_COLLECTOR_URL}",
            "BASE_URL": "",
            "PORT": "3333",
            "CI_DEMO_VERSIONING": "true"
          }
          EOF
          echo "Created Flutter config.json (FARO_COLLECTOR_URL redacted)"

      - name: Build Flutter iOS .app for Simulator
        id: build-flutter-ios-app
        working-directory: Mobiles/flutter
        run: |
          set -e
          echo "Building Flutter iOS .app for Simulator..."
          flutter build ios --debug --simulator --dart-define-from-file=config.json

          APP_PATH="build/ios/iphonesimulator/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Could not locate Flutter iOS .app at $APP_PATH"
            find build/ios -maxdepth 4 -name "*.app" -type d
            exit 1
          fi
          echo "Built app: $APP_PATH"
          echo "app_path=$(pwd)/$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          # Ruby 3.4 currently breaks this CocoaPods install via missing kconv.
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install React Native JavaScript dependencies
        working-directory: Mobiles/react-native
        run: yarn install --immutable

      - name: Install React Native iOS dependencies
        working-directory: Mobiles/react-native
        run: |
          bundle config set path vendor/bundle
          bundle install
          cd ios
          bundle exec pod install

      - name: Create React Native config.json for CI
        working-directory: Mobiles/react-native
        env:
          FARO_COLLECTOR_URL: ${{ env.FARO_COLLECTOR_URL_RN }}
        run: |
          cat > config.json << EOF
          {
            "FARO_COLLECTOR_URL": "${FARO_COLLECTOR_URL}",
            "BASE_URL": "",
            "PORT": "3333"
          }
          EOF
          echo "Created React Native config.json (FARO_COLLECTOR_URL redacted)"

      - name: Resolve React Native demo app version
        run: |
          DEMO_APP_BASE_VERSION="$(node .github/scripts/read-demo-app-base-version.mjs react-native)"
          DEMO_APP_VERSION="$(node .github/scripts/resolve-demo-app-version.mjs "${DEMO_APP_BASE_VERSION}")"
          echo "DEMO_APP_VERSION=${DEMO_APP_VERSION}" >> "$GITHUB_ENV"
          echo "React Native demo app version: ${DEMO_APP_VERSION} (base: ${DEMO_APP_BASE_VERSION})"

      - name: Build React Native iOS .app for Simulator
        id: build-react-native-ios-app
        working-directory: Mobiles/react-native
        run: |
          set -e
          echo "Building React Native iOS .app for Simulator..."
          mkdir -p ios/build/ci
          set +e
          # Release + FORCE_BUNDLING embeds the JS bundle so e2e does not need Metro.
          FORCE_BUNDLING=1 xcodebuild \
            -workspace ios/QuickPizza.xcworkspace \
            -scheme QuickPizza \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.grafana.quickpizza \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build > ios/build/ci/xcodebuild.log 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo "xcodebuild failed with status $build_status"
            echo "Relevant build diagnostics:"
            grep -nE "error:|fatal error:|BUILD FAILED|The following build commands failed|Command SwiftCompile failed" ios/build/ci/xcodebuild.log | tail -200 || true
            echo "Last 300 xcodebuild log lines:"
            tail -300 ios/build/ci/xcodebuild.log
            exit "$build_status"
          fi

          tail -80 ios/build/ci/xcodebuild.log

          APP_PATH=$(find ios/DerivedData/Build/Products -name "QuickPizza.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not locate built QuickPizza.app under ios/DerivedData"
            find ios/DerivedData/Build/Products -maxdepth 4 -name "*.app" -type d || true
            exit 1
          fi
          echo "Built app: $APP_PATH"
          echo "app_path=$(pwd)/$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload React Native iOS build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-native-ios-build-log
          path: Mobiles/react-native/ios/build/ci/xcodebuild.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Set up Go (QuickPizza backend)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build QuickPizza backend
        run: |
          set -e
          make build-go

      - name: Start QuickPizza backend
        env:
          DEPLOYMENT_ENVIRONMENT: ci
        run: |
          set -e
          touch backend-ios.log
          echo "Starting QuickPizza backend natively on macOS..."
          QUICKPIZZA_TRUST_CLIENT_TRACEID=1 \
          QUICKPIZZA_ENABLE_ALL_SERVICES=1 \
          QUICKPIZZA_DB= \
          QUICKPIZZA_RECOMMENDATIONS_HTTP_CLIENT_TIMEOUT=10s \
          QUICKPIZZA_OTLP_ENDPOINT="${QUICKPIZZA_OTLP_ENDPOINT:?Forwarding endpoint missing}" \
          QUICKPIZZA_OTEL_SERVICE_NAME=quickpizza-ios-ci-backend \
          QUICKPIZZA_OTEL_RECORD_BODIES=true \
          OTEL_RESOURCE_ATTRIBUTES="deployment.environment=${DEPLOYMENT_ENVIRONMENT},service.version=quickpizza-local" \
          ./bin/quickpizza > backend-ios.log 2>&1 &
          echo "$!" > backend-ios.pid

          python3 Mobiles/telemetry/telemetry.py status --run-dir Mobiles/telemetry/.runtime/ci
          echo "Waiting for backend to be ready..."
          for i in {1..60}; do
            if curl -fsS "http://localhost:3333/ready" > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend... attempt $i/60"
            sleep 2
          done

          echo "Backend did not become ready in time"
          cat backend-ios.log
          exit 1

      - name: Boot iOS simulator
        run: |
          set -e
          # Pick the newest available iPhone runtime/device on the runner.
          IFS=$'\t' read -r DEVICE_UDID DEVICE_NAME < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data.get("devices", {}).keys(), reverse=True):
              for d in data["devices"][runtime]:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      print(d["udid"], d["name"], sep="\t")
                      sys.exit(0)
          sys.exit(1)
          ')
          if [ -z "$DEVICE_UDID" ]; then
            echo "No available iPhone simulator on this runner image"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting simulator: $DEVICE_NAME ($DEVICE_UDID)"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl list devices booted

      - name: Setup npm
        run: npm install -g npm@11.10.0

      - name: Install shared e2e report generator deps
        working-directory: Mobiles/e2e/report-generator
        run: npm ci --ignore-scripts

      - name: Install iOS apps and run e2e tests
        timeout-minutes: 45
        env:
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          IOS_NATIVE_APP_PATH: ${{ steps.build-ios-app.outputs.app_path }}
          FLUTTER_IOS_APP_PATH: ${{ steps.build-flutter-ios-app.outputs.app_path }}
          REACT_NATIVE_IOS_APP_PATH: ${{ steps.build-react-native-ios-app.outputs.app_path }}
        run: |
          set -e

          echo "==> Native iOS .app: install and E2E"
          if [ ! -d "$IOS_NATIVE_APP_PATH" ]; then
            echo "Expected QuickPizzaIos.app at $IOS_NATIVE_APP_PATH but it does not exist"
            exit 1
          fi
          xcrun simctl uninstall booted com.grafana.QuickPizzaIos || true
          xcrun simctl install booted "$IOS_NATIVE_APP_PATH"
          xcrun simctl get_app_container booted com.grafana.QuickPizzaIos
          bash Mobiles/e2e/run_e2e_tests.sh --app=ios-native --platform=ios

          [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" = "true" ] || echo "Skipping Native iOS handled-exception diagnostics for this run."
          [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || echo "==> Native iOS .app: handled-exception diagnostics E2E"
          [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=ios-native --platform=ios --flow=handled-exception
          [ "$RUN_CRASH_DIAGNOSTICS" = "true" ] || echo "Skipping Native iOS crash diagnostics for this run. Manual runs can force this with run_diagnostics=true."
          [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || echo "==> Native iOS .app: crash diagnostics E2E"
          [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=ios-native --platform=ios --flow=diagnostics

          echo "==> Flutter iOS .app: install and E2E"
          if [ ! -d "$FLUTTER_IOS_APP_PATH" ]; then
            echo "Expected Runner.app at $FLUTTER_IOS_APP_PATH but it does not exist"
            exit 1
          fi
          xcrun simctl uninstall booted com.example.flutterMobileO11yDemo || true
          xcrun simctl install booted "$FLUTTER_IOS_APP_PATH"
          xcrun simctl get_app_container booted com.example.flutterMobileO11yDemo
          bash Mobiles/e2e/run_e2e_tests.sh --app=flutter --platform=ios
          [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || echo "==> Flutter iOS .app: handled-exception diagnostics E2E"
          [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=flutter --platform=ios --flow=handled-exception
          [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || echo "==> Flutter iOS .app: crash diagnostics E2E"
          [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=flutter --platform=ios --flow=diagnostics

          echo "==> React Native iOS .app: install and E2E"
          if [ ! -d "$REACT_NATIVE_IOS_APP_PATH" ]; then
            echo "Expected QuickPizza.app at $REACT_NATIVE_IOS_APP_PATH but it does not exist"
            exit 1
          fi
          xcrun simctl uninstall booted com.grafana.quickpizza || true
          xcrun simctl install booted "$REACT_NATIVE_IOS_APP_PATH"
          xcrun simctl get_app_container booted com.grafana.quickpizza
          bash Mobiles/e2e/run_e2e_tests.sh --app=react-native --platform=ios
          [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || echo "==> React Native iOS .app: handled-exception diagnostics E2E"
          [ "$RUN_HANDLED_EXCEPTION_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=react-native --platform=ios --flow=handled-exception
          [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || echo "==> React Native iOS .app: crash diagnostics E2E"
          [ "$RUN_CRASH_DIAGNOSTICS" != "true" ] || bash Mobiles/e2e/run_e2e_tests.sh --app=react-native --platform=ios --flow=diagnostics

          echo "iOS E2E tests completed (Native iOS, Flutter iOS, React Native iOS on same simulator)."

      - name: Finish telemetry export
        run: |
          sleep 30
          python3 Mobiles/telemetry/telemetry.py status --run-dir Mobiles/telemetry/.runtime/ci

      - name: Upload e2e test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-ios
          path: Mobiles/e2e/results/
          retention-days: 1
          if-no-files-found: ignore

      - name: Collect backend logs
        if: always()
        run: |
          if [ -f backend-ios.log ]; then
            tail -200 backend-ios.log
          fi

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend-ios.pid ]; then
            kill "$(cat backend-ios.pid)" || true
          fi

      - name: Stop dual-stack forwarding
        if: always()
        run: python3 Mobiles/telemetry/telemetry.py stop --run-dir Mobiles/telemetry/.runtime/ci

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-logs-ios
          path: backend-ios.log
          retention-days: 3
          if-no-files-found: ignore
