# DEMO: This workflow demonstrates how to verify k6 scripts without running
# them via the grafana/run-k6-action GitHub Action. It is not part of the real
# CI pipeline. See ci.yaml for the authoritative test workflow.
name: Verify scripts Workflow
on: [push]

permissions:
  contents: read

jobs:
  basic_k6_test:
    name: k6 test run - verify scripts example
    runs-on: ubuntu-latest

    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:0.15.30@sha256:93d322a244a1313842e2b3ccb791f993034dbeab716e69b7e760a4ae0fdc5d22 # zizmor: ignore[unpinned-images]
        ports:
          - 3333:3333

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: Verify test script
        uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
        with:
          path: |
            ./k6/foundations/01.basic.js
          only-verify-scripts: true
