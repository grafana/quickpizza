name: Dependency Review

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Allow only Apache-2.0 compatible licenses (Apache Category A)
          # Based on https://www.apache.org/legal/resolved.html
          allow-licenses: >-
            Apache-2.0, MIT, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD,
            BlueOak-1.0.0, Unlicense, CC0-1.0,
            CC-BY-4.0,
            Artistic-2.0
          # Published Faro 0.17.0 and Dartastic 0.11.0 LICENSE files are Apache-2.0,
          # but GitHub reports lowercase apache-2.0, which this action rejects.
          # Related Pub license-casing report: https://github.com/orgs/community/discussions/200564
          # Remove when GitHub returns canonical SPDX identifiers. These license-only
          # exceptions cover all versions of these packages; vulnerability checks stay enabled.
          # golang.org/x/* are BSD-3-Clause; GitHub adds a LicenseRef for Go's extra
          # PATENTS grant, which this action rejects. go-hex is BSD-3-Clause but
          # GitHub reports NOASSERTION. k6 (AGPL-3.0) is only built into a throwaway
          # binary by the k6 extension test in ci.yaml; it never ships in the image.
          allow-dependencies-licenses: >-
            pkg:pub/faro,
            pkg:pub/dartastic_opentelemetry,
            pkg:pub/dartastic_opentelemetry_api,
            pkg:golang/golang.org/x/crypto,
            pkg:golang/golang.org/x/net,
            pkg:golang/golang.org/x/sys,
            pkg:golang/golang.org/x/text,
            pkg:golang/golang.org/x/time,
            pkg:golang/github.com/tmthrgd/go-hex,
            pkg:golang/go.k6.io/k6/v2
