# DEMO: This workflow demonstrates how to use the grafana/setup-k6-action and
# grafana/run-k6-action GitHub Actions. It is not part of the real CI pipeline.
# See ci.yaml for the authoritative test workflow.
name: Example Tests Workflow
on: [push]

permissions:
  contents: read

jobs:
  basic_k6_test:
    name: k6 test run - basic example
    runs-on: ubuntu-latest

    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:0.15.30@sha256:93d322a244a1313842e2b3ccb791f993034dbeab716e69b7e760a4ae0fdc5d22 # zizmor: ignore[unpinned-images]
        ports:
          - 3333:3333

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - name: Run k6 test
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        with:
          path: |
            ./k6/foundations/01.basic.js
          flags: --duration 5s

  k6_all_tests:
    name: k6 test run - foundations and internal tests
    runs-on: ubuntu-latest

    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:0.15.30@sha256:93d322a244a1313842e2b3ccb791f993034dbeab716e69b7e760a4ae0fdc5d22 # zizmor: ignore[unpinned-images]
        ports:
          - 3333:3333

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          browser: true
      - name: Run k6 test
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        with:
          path: |
            ./k6/foundations/*.js
            ./k6/foundations/*.ts
            ./k6/internal/*.js
