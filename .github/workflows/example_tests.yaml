# DEMO: This workflow demonstrates how to use the grafana/setup-k6-action and
# grafana/run-k6-action GitHub Actions. It is not part of the real CI pipeline.
# See ci.yaml for the authoritative test workflow.
name: Example Tests Workflow
on: [push]

permissions:
  contents: read

jobs:
  basic_k6_test:
    name: k6 test run - basic example
    runs-on: ubuntu-latest

    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:0.15.32@sha256:9d6df3cbb94ea61ee79083fdcc047a77d7131d1142d5bd4c9fe943fbd57b588c # zizmor: ignore[unpinned-images]
        ports:
          - 3333:3333

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: Run k6 test
        uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
        with:
          path: |
            ./k6/foundations/01.basic.js
          flags: --duration 5s

  k6_all_tests:
    name: k6 test run - foundations and internal tests
    runs-on: ubuntu-latest

    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:0.15.32@sha256:9d6df3cbb94ea61ee79083fdcc047a77d7131d1142d5bd4c9fe943fbd57b588c # zizmor: ignore[unpinned-images]
        ports:
          - 3333:3333

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          browser: true
      - name: Run k6 test
        uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
        with:
          path: |
            ./k6/foundations/*.js
            ./k6/foundations/*.ts
            ./k6/internal/*.js
