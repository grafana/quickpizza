# NOTE:
# It is important that these actions are run for every PR, no matter what
# other actions are added. The ones here are testing the actual code pushed
# instead of a possibly outdated image. Additionally, we also run formatters
# and linters here.
# Do not modify this file unless you really need to. You very likely don't need to.

name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runner-job:
    runs-on: ubuntu-latest
    env:
      K6_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Setup Goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.42.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ">=24.5.0"

      - name: Setup npm
        run: npm install -g npm@11.10.0

      - name: Check Formatting (Go)
        run: make format-check

      - name: Build Binary
        run: make build

      - name: Run Go Tests
        run: make test-go

      - name: Run Biome Checks
        run: cd pkg/web && npm run biome-check

      - name: Start Server
        # Use enable these features in our own deployment, so we might as well
        # "enable" them during testing as well to simulate a more realistic setup.
        env:
          QUICKPIZZA_OTLP_ENDPOINT: "http://localhost"
          QUICKPIZZA_TRUST_CLIENT_TRACEID: "1"
          QUICKPIZZA_PYROSCOPE_ENDPOINT: "http://localhost"
        run: ./bin/quickpizza &

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          browser: false # Use runner Chrome; run-tests.sh supplies browser flags.

      - name: Install jq
        uses: dcarbone/install-jq-action@e397bd87438d72198f81efd21f876461183d383a # v3.0.1

      - name: Run k6 foundations tests
        run: ./k6/run-tests.sh -t **/k6/foundations/*.js -u http://localhost:3333

      - name: Run k6 foundations TS tests
        run: ./k6/run-tests.sh -t **/k6/foundations/*.ts -u http://localhost:3333

      - name: Run k6 internal tests
        run: ./k6/run-tests.sh -t **/k6/internal/*.js -u http://localhost:3333

      - name: Verify runner Chrome
        run: |
          # Hosted Ubuntu runners include Chrome; avoid reinstalling it from apt.
          test -x "$K6_BROWSER_EXECUTABLE_PATH"
          "$K6_BROWSER_EXECUTABLE_PATH" --version

      - name: Run k6 browser tests
        run: ./k6/run-tests.sh -t **/k6/browser/*.js -u http://localhost:3333

      - name: Install xk6
        run: go install go.k6.io/xk6/cmd/xk6@latest

      - name: Build custom k6 binary with quickpizzaext
        run: |
          xk6 build \
            --output k6/extensions/k6 \
            --with github.com/grafana/quickpizza/extensions/quickpizzaext=./k6/extensions/quickpizzaext \
            --replace github.com/grafana/quickpizza=.

      - name: Run k6 extension tests
        run: ./k6/extensions/k6 run k6/extensions/01.quickpizzaext.js

      - name: Stop Server
        run: pkill -9 quickpizza
